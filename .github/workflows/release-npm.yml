name: Release to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build packages
        run: bun run build

      - name: Publish packages
        if: github.event_name == 'release' || inputs.publish
        run: |
          set -euo pipefail

          # Publish core first so dependent packages can resolve it on npm.
          packages=(core sdk postgres mongodb sqlite neo4j qdrant redis minio)

          for package in "${packages[@]}"; do
            directory="packages/$package"
            name=$(node -p "require('./$directory/package.json').name")
            version=$(node -p "require('./$directory/package.json').version")

            if npm view "$name@$version" version --json >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              continue
            fi

            echo "Publishing $name@$version"
            (cd "$directory" && bun publish --access public)
          done
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
