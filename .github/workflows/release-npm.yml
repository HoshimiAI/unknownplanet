name: Release to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build packages
        run: bun run build

      - name: Publish packages
        if: github.event_name == 'release' || inputs.publish
        run: |
          set -euo pipefail

          # Publish core first so dependent packages can resolve it on npm.
          packages=(core sdk postgres mongodb sqlite neo4j qdrant redis minio)

          for package in "${packages[@]}"; do
            directory="packages/$package"
            name=$(node -p "require('./$directory/package.json').name")
            version=$(node -p "require('./$directory/package.json').version")

            if npm view "$name@$version" version --json >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              continue
            fi

            echo "Publishing $name@$version"
            node - "$directory" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = process.argv[2];
          const manifestPath = path.join(directory, "package.json");
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));

          for (const field of ["dependencies", "optionalDependencies"]) {
            for (const [dependency, range] of Object.entries(manifest[field] ?? {})) {
              if (range === "workspace:*") {
                const workspaceName = dependency.split("/").at(-1);
                const workspaceManifest = JSON.parse(
                  fs.readFileSync(path.join("packages", workspaceName, "package.json"), "utf8"),
                );
                manifest[field][dependency] = `^${workspaceManifest.version}`;
              }
            }
          }

          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
            (cd "$directory" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
